# One-command deployment: API + Qdrant server.
#
#   docker compose up --build
#
# The API then lives at http://localhost:8000 (docs at /docs).
# Leave OPENAI_API_KEY unset to run fully offline (local embeddings +
# extractive answers); set it in your shell or a .env file to use an
# OpenAI-compatible API instead.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Inside the Compose network the Qdrant server is reachable as
      # "qdrant". With QDRANT_URL set, the app uses server mode instead
      # of the embedded local store.
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
